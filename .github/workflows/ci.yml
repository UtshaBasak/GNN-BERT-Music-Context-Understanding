name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # torch first and from the CPU index. PyTorch Geometric compiles against
      # a specific torch build, so installing them together lets pip resolve a
      # pair that does not work. The optional pyg-lib / torch-scatter wheels are
      # not installed: SAGEConv and GATv2Conv both run on PyG's pure-torch path,
      # which is the path this project uses.
      - name: Install torch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyTorch Geometric
        run: pip install torch-geometric

      # requirements.txt pins torch==2.14.0+cu126, which resolves only from the
      # CUDA index. Install everything else and let the CPU wheel already
      # present satisfy the torch requirement.
      - name: Install remaining dependencies
        run: |
          grep -vE '^(torch|torch-geometric)==|^--extra-index-url' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt

      # The suite is designed to run without the corpora: anything needing audio
      # skips rather than fails, so a checkout with no data still proves the
      # pipeline is wired correctly.
      - name: Run the fast suite
        run: pytest -m "not slow" --tb=short -q
