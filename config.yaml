# =============================================================================
# GNN-BERT Music Context Understanding -- single source of truth.
# Every script loads this file; every CLI flag (--override key=value) wins.
# =============================================================================
seed: 42
device: cuda
amp: true

paths:
  raw: data/raw
  processed: data/processed
  splits: data/splits
  results: results
  checkpoints: results/checkpoints

# Where each corpus actually lives under paths.raw. Kept explicit so a machine
# with a different on-disk layout only edits this block (no hardcoded paths).
datasets:
  mtat:
    root: data/raw/mtat
    audio: data/raw/mtat/audio
    annotations: data/raw/mtat/annotations_final.csv
    clip_info: data/raw/mtat/clip_info_final.csv
  fma:
    root: data/raw/fma
    audio: data/raw/fma/fma_small
    metadata: data/raw/fma/fma_metadata
  musiccaps:
    root: data/raw/musiccaps
    audio: data/raw/musiccaps/audio
    csv: data/raw/musiccaps/musiccaps-public.csv
    clip_duration_s: 10.0
    duration_tol_s: 1.0
  deam:
    root: data/raw/deam
    audio: data/raw/deam/audio
    annotations: data/raw/deam/annotations
    metadata: data/raw/deam/metadata
  lmd:
    root: data/raw/lmd_clean

audio:
  sample_rate: 22050
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  n_chroma: 12
  n_mfcc: 20
  n_bands: 6                  # spectral_contrast -> n_bands + 1 = 7 coefficients
  mel_dtype: float16          # halves cache size; 4 GB VRAM / 16 GB RAM budget
  max_duration_s: 30.0

segmentation:
  mode: fixed                 # fixed | beat_sync
  window_s: 3.0
  overlap: 0.5
  min_nodes: 4
  max_nodes: 32

graph:
  knn_k: 4                    # k-NN, NOT a fixed cosine threshold tau
  add_self_loops: true
  # edge-type ablation runs through these two flags: both true is the
  # headline, similarity_edges=false is temporal-only, temporal_edges=false is
  # similarity-only. They are honoured at graph-build time, and MusicGraphDataset
  # builds on the fly, so an --override is enough -- no cache rebuild.
  temporal_edges: true
  similarity_edges: true
  # structural control. Degree-preserving double-edge swaps, seeded per
  # track so a clip is rewired identically in every epoch. If macro-F1 survives
  # this, the topology carried no signal and the GNN is a pooled-feature MLP.
  rewire: false
  node_feat_dim: 96           # asserted at build time
  chord_vocab_size: 25        # 12 roots x {maj, min} + N.C.
  chord_feat_dim: 13          # [vocab index / 24] + aggregated 12-bin chroma

chords:
  smoothing_frames: 9         # median filter width over frame-wise decisions
  min_energy: 1.0e-6          # below this a frame is declared "N" (no chord)

# ---------------------------------------------------------------------------
# LOCAL-VS-KAGGLE ROUTING, measured on the actual GTX 1650 (state/vram_report.md)
# Judged on max_memory_reserved against a 3277 MB safe threshold (80% of 4 GB).
#
#   Task 1 distilbert        b<=32  seq128           1574 MB   local
#   Task 1 bert-base         b<=32  seq128           2620 MB   local
#   Task 1 bert-base         b=64   seq128           4254 MB   NEEDS grad ckpt
#   Task 1 bert-base         b=32   seq256           4254 MB   NEEDS grad ckpt
#   Task 1 bert-base + ckpt  b=64   seq128           2234 MB   local
#   Task 2 GNN               b<=128                   130 MB   local, trivial
#   Task 3 fusion distilbert b<=16  seq128           1418 MB   local
#   Task 3 fusion bert-base  b<=32  seq128           2642 MB   local
#   Task 3 fusion bert-base  b=64 + ckpt             2268 MB   local
#   Task 4 frozen+precompute b=2048                  1802 MB   local
#
# Peak is dominated by AdamW optimiser state, not activations: fusion costs only
# ~14 MB more than the text encoder alone. What forces work to Kaggle is
# wall-clock (3 freeze modes x 3 seeds), not memory.
# ---------------------------------------------------------------------------
bert:
  model_name: distilbert-base-uncased   # bert-base-uncased for final runs
  gradient_checkpointing: false         # a no-op below batch 32; -45% peak at 64
  max_length: 128
  freeze_epochs: 3
  unfreeze_top_n_layers: 4
  freeze_mode: top_n          # frozen_probe | top_n | full_ft

gnn:
  conv: sage                  # sage | gatv2
  hidden_dim: 256
  num_layers: 2               # keep shallow: 10-32 node graphs oversmooth fast
  dropout: 0.3
  readout: mean_max           # mean | max | mean_max | attention
  residual: true
  heads: 4                    # GATv2 heads

fusion:
  mode: cross_attention       # bert_only | gnn_only | early_concat | late_concat | cross_attention | gated | bidirectional
  shared_dim: 256
  n_heads: 4

contrastive:
  temperature_init: 0.07
  learnable_temperature: true
  clamp_logit_scale: 100.0
  symmetric: true
  batch_size: 512
  precompute_text: true

multitask:
  alpha_valence: 1.0
  beta_arousal: 1.0
  auto_balance: true          # rescale by running loss magnitude
  ema_decay: 0.98             # smoothing for the running loss magnitudes
  # DEAM has ~1,200 train tracks against MTAT's 16,881, about 1:14.
  # One-for-one alternation shows the emotion head every DEAM track fourteen
  # times per MTAT epoch and it overfits hard while the tag head sees each
  # example once. 4 tag batches : 1 emotion batch, recorded in every result.
  batch_ratio: [4, 1]
  # Targets are standardised with train-split statistics before the MSE (see
  # src.splits.compute_emotion_stats) and predictions are inverted again before
  # MAE/RMSE are reported, so the numbers stay on DEAM's original 1-9 scale.
  # Written to data/splits/emotion_stats.json on first use.
  standardise_targets: true

train:
  batch_size: 8
  grad_accum_steps: 4         # effective batch 32
  lr_bert: 2.0e-5
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.1
  epochs: 10
  early_stop_patience: 3
  early_stop_metric: val_macro_f1
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  grad_clip: 1.0
  log_every: 50
  wandb: false
  wandb_project: gnn-bert-music-context
  tensorboard: false

# ---------------------------------------------------------------------------
# what goes into Xtext, and why it is not the labels.
#
# MTAT ships NO captions or lyrics, only tags. Feeding a track's tags in to
# predict those same tags is degenerate. MusicCaps captions are written *from*
# the aspect list, so the raw caption also contains its own labels almost
# verbatim. Locked configuration:
#
#   Run                | Dataset    | text_source     | Purpose
#   -------------------|------------|-----------------|--------------------------
#   Task 1 headline    | MusicCaps  | caption_masked  | the main Task 1 number
#   Task 1 leakage demo| MusicCaps  | caption_raw     | quantifies the inflation
#   Task 1 secondary   | MTAT       | metadata        | non-circular, weak signal
#   Task 3 primary     | MTAT       | metadata        | PDF asks for MTAT results
#   Task 3 secondary   | MusicCaps  | caption_masked  | rich-text domain
#
# The payoff: fusion gain should scale with text informativeness -- large on
# MusicCaps captions, small on MTAT metadata. That contrast is a stronger
# result than either dataset alone.
#
# Variants live in data/splits/{dataset}_text_variants.csv; the manifest schema
# stays frozen at its ten columns.
# ---------------------------------------------------------------------------
data:
  text_source: caption_masked   # caption_masked | caption_raw | metadata
  # Which corpora a task draws from. Kept explicit because mixing corpora with
  # different label vocabularies silently fills rows with all-negative targets:
  # scoring MusicCaps against the MTAT top-50 leaves 62% of its clips with no
  # positive label at all.
  tag_corpora: [mtat]                 # Tasks 1-3 tag supervision
  emotion_corpora: [deam]             # Task 3 valence/arousal
  caption_corpora: [musiccaps]        # Task 4 retrieval
  genre_corpora: [fma]                # Task 2 headline; the only genre labels

  # Task 2 has two reported domains and `genre` is the headline, because
  # that is what the deliverable asks for: 8-way single-label classification on
  # FMA-small. The split is near-balanced (train 797-801, val 98-100, test
  # 100-101 per class), so chance sits at 12.5% and plain accuracy is meaningful
  # -- unlike the multi-label MTAT task, where it never is. Switch with
  # `--override data.task2_target=tags` to get the MTAT multi-label run, which
  # is kept as the second domain because it shares Task 3's label space.
  task2_target: genre                 # genre | tags
  genre_names: [Electronic, Experimental, Folk, Hip-Hop,
                Instrumental, International, Pop, Rock]

tags:
  top_k: 50
  merge_synonyms: true
  # Which label vocabulary a run trains against. Measured on the real corpora:
  # only 0.52 of MusicCaps 10.7 aspects per clip appear in the MTAT top-50, and
  # 62% of MusicCaps clips match none of it, so the Task 1 MusicCaps headline
  # must use the MusicCaps vocabulary or most rows carry no positive label.
  #   mtat      -> data/splits/tag_vocab.json            (MTAT/Task 3 primary)
  #   musiccaps -> data/splits/musiccaps_tag_vocab.json  (Task 1 headline)
  vocab_source: mtat

splits:
  # MTAT's canonical hex-folder split is NOT artist-disjoint: Magnatune albums
  # are hashed across directories, so ~57 artists have clips in two folders.
  # With this on, each such artist is moved wholesale into its majority split
  # before the leakage assertion runs. Turn it off only to reproduce the
  # (leaky) literature split exactly, and say so in the report.
  enforce_artist_disjoint: true

eval:
  tune_thresholds: true
  n_seeds: 3
  seeds: [42, 1337, 2024]
  tsne_perplexity: 30
  graph_coherence_tau: 0.5
  knn_probe_k: 10
  retrieval_examples: 10

# ---------------------------------------------------------------------------
# B2 (mel CNN) is compared on compute budget, not parameter count.
# Matching it to the GNN's ~430k parameters is what produced the implausible
# 0.1654 macro-F1; a short-chunk CNN at ~3.4M parameters is the standard MTAT
# baseline. It reads data/processed/mels_full_{corpus}.h5 at the native 43.07
# frames/second (build it with scripts/build_mel_cache.py), trains on random
# 3 s excerpts, and averages per-chunk probabilities over 9 evenly-spaced
# excerpts at inference.
# ---------------------------------------------------------------------------
baselines:
  cnn_chunk_s: 3.0            # 129 frames at 22050 Hz / hop 512
  cnn_eval_chunks: 9          # 29 s MTAT clip / 3 s, non-overlapping
  cnn_batch_size: 32
  cnn_eval_batch_size: 8      # x9 chunks = 72; 32x9 measures 2.5 GB reserved
  # Measured on the 16,881-clip MTAT train split, input path only:
  #   workers=0  108 ms/batch  0.95 min/epoch
  #   workers=2   54 ms/batch  0.47 min/epoch
  #   workers=3   15 ms/batch  0.13 min/epoch
  # 3 is fastest, but spawn workers re-import torch and 4 of them alongside a
  # resident BERT is what produced WinError 1455 (paging file too small) in
  # phase A. 2 takes half the remaining risk for half the remaining time; the
  # ~24 min it gives up over 30 epochs is not worth losing a two-hour run to.
  cnn_workers: 2
  cnn_use_accumulation: false # batch 32 fits; turn on if the card gets smaller

# ---------------------------------------------------------------------------
# mood labels for the t-SNE panels.
#
# Neither corpus ships a mood field, so both colourings are DEFINED here rather
# than chosen at plot time, where the temptation is to pick whichever subset
# makes the picture look cleanest.
#
# MTAT: an explicit subset of the top-50 tags that denote affect rather than
# instrumentation or genre. Checked against the vocabulary actually on disk --
# sad, happy, mellow, calm, dark, upbeat, eerie was proposed and dropped because
# it is not in the current top-50. A clip is coloured by its FIRST matching mood
# tag in this order, and clips with none are drawn in grey and excluded from the
# k-NN probe rather than lumped into an "other" class that would inflate it.
#
# DEAM: valence/arousal split at the 1-9 scale midpoint (5.0) into the four
# standard affect quadrants.
# ---------------------------------------------------------------------------
mood:
  mtat_tags: [soft, hard, ambient, quiet, loud, slow, fast, weird]
  deam_midpoint: 5.0
  # Listed in the order of the index the code assigns,
  # (valence >= midpoint) * 2 + (arousal >= midpoint), so position i IS class i.
  # Keeping these in "circumplex order" instead would silently mislabel the
  # legend, which is the kind of error a plot never reveals.
  deam_quadrants:
    - low valence / low arousal      # 0
    - low valence / high arousal     # 1
    - high valence / low arousal     # 2
    - high valence / high arousal    # 3

synthetic:
  n_tracks: 200
  n_tags: 50
  out_dir: data/processed/synthetic

human_eval:
  n_items: 20
  n_controls: 4
